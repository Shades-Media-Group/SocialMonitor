<!doctype html>
<html lang="en">
  <head>

    <title>Back to SocialMonitor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>

          sans-serif;
      }

        max-width: 420px;
        padding: 24px;
      }

        margin: 0 0 6px;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: #5b6270;

    <script src="/connect/tiktok/relay.js" defer></script>

    <main>
      <h1>Back to SocialMonitor…</h1>
      <p id="msg">

      </p>
    </main>
